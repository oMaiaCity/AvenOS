name: platform-release

# Builds read package dependencies, never deployment or recovery credentials.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: aven-platform-release-next
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/next' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/platform-verification.yml
    permissions:
      contents: read
      packages: read
    secrets:
      PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      identity: ghcr.io/myavenceo/aven-identity@${{ steps.identity.outputs.digest }}
      api: ghcr.io/myavenceo/aven-api@${{ steps.api.outputs.digest }}
      checkout: ghcr.io/myavenceo/aven-checkout@${{ steps.checkout.outputs.digest }}
      static_host: ghcr.io/myavenceo/aven-static-site-host@${{ steps.static_host.outputs.digest }}
      provisioner: ghcr.io/myavenceo/aven-platform-provisioner@${{ steps.provisioner.outputs.digest }}
      intent: ghcr.io/myavenceo/aven-intent-service@${{ steps.intent.outputs.digest }}
      actor: ghcr.io/myavenceo/aven-actor-runner@${{ steps.actor.outputs.digest }}
      artifact: ghcr.io/myavenceo/aven-artifact-store@${{ steps.artifact.outputs.digest }}
      operations: ghcr.io/myavenceo/aven-operations@${{ steps.operations.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: database
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/database/Dockerfile
          cache-from: type=gha,scope=release-deploy-database
          cache-to: type=gha,mode=max,scope=release-deploy-database
          push: true
          tags: ghcr.io/myavenceo/aven-database:run-${{ github.run_id }}-${{ github.run_attempt }}
      - id: proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/proxy/Dockerfile
          cache-from: type=gha,scope=release-deploy-proxy
          cache-to: type=gha,mode=max,scope=release-deploy-proxy
          push: true
          tags: ghcr.io/myavenceo/aven-proxy:run-${{ github.run_id }}-${{ github.run_attempt }}
      - id: identity
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/identity/Dockerfile
          cache-from: type=gha,scope=release-services-identity
          cache-to: type=gha,mode=max,scope=release-services-identity
          push: true
          tags: ghcr.io/myavenceo/aven-identity:run-${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            npm_token=${{ secrets.PACKAGE_READ_TOKEN }}
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/aven-api/Dockerfile
          cache-from: type=gha,scope=release-services-aven-api
          cache-to: type=gha,mode=max,scope=release-services-aven-api
          push: true
          tags: ghcr.io/myavenceo/aven-api:run-${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            npm_token=${{ secrets.PACKAGE_READ_TOKEN }}
      - id: checkout
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/checkout/Dockerfile
          cache-from: type=gha,scope=release-services-checkout
          cache-to: type=gha,mode=max,scope=release-services-checkout
          push: true
          tags: ghcr.io/myavenceo/aven-checkout:run-${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            npm_token=${{ secrets.PACKAGE_READ_TOKEN }}
      - id: static_host
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/static-site-host/Dockerfile
          cache-from: type=gha,scope=release-services-static-site-host
          cache-to: type=gha,mode=max,scope=release-services-static-site-host
          push: true
          tags: ghcr.io/myavenceo/aven-static-site-host:run-${{ github.run_id }}-${{ github.run_attempt }}
      - id: provisioner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/platform-provisioner/Dockerfile
          cache-from: type=gha,scope=release-services-platform-provisioner
          cache-to: type=gha,mode=max,scope=release-services-platform-provisioner
          push: true
          tags: ghcr.io/myavenceo/aven-platform-provisioner:run-${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            npm_token=${{ secrets.PACKAGE_READ_TOKEN }}
      - id: intent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/intent-service/Dockerfile
          cache-from: type=gha,scope=release-services-intent-service
          cache-to: type=gha,mode=max,scope=release-services-intent-service
          push: true
          tags: ghcr.io/myavenceo/aven-intent-service:run-${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            npm_token=${{ secrets.PACKAGE_READ_TOKEN }}
      - id: actor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/actor-runner/Dockerfile
          cache-from: type=gha,scope=release-services-actor-runner
          cache-to: type=gha,mode=max,scope=release-services-actor-runner
          push: true
          tags: ghcr.io/myavenceo/aven-actor-runner:run-${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            npm_token=${{ secrets.PACKAGE_READ_TOKEN }}
      - id: artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/artifact-store/Dockerfile
          cache-from: type=gha,scope=release-services-artifact-store
          cache-to: type=gha,mode=max,scope=release-services-artifact-store
          push: true
          tags: ghcr.io/myavenceo/aven-artifact-store:run-${{ github.run_id }}-${{ github.run_attempt }}
      - id: operations
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/operations/Dockerfile
          cache-from: type=gha,scope=release-deploy-operations
          cache-to: type=gha,mode=max,scope=release-deploy-operations
          push: true
          tags: ghcr.io/myavenceo/aven-operations:run-${{ github.run_id }}-${{ github.run_attempt }}


      - name: Record immutable release manifest
        env:
          IDENTITY_IMAGE: ghcr.io/myavenceo/aven-identity@${{ steps.identity.outputs.digest }}
          DATABASE_IMAGE: ghcr.io/myavenceo/aven-database@${{ steps.database.outputs.digest }}
          PROXY_IMAGE: ghcr.io/myavenceo/aven-proxy@${{ steps.proxy.outputs.digest }}
          API_IMAGE: ghcr.io/myavenceo/aven-api@${{ steps.api.outputs.digest }}
          CHECKOUT_IMAGE: ghcr.io/myavenceo/aven-checkout@${{ steps.checkout.outputs.digest }}
          STATIC_SITE_HOST_IMAGE: ghcr.io/myavenceo/aven-static-site-host@${{ steps.static_host.outputs.digest }}
          PLATFORM_PROVISIONER_IMAGE: ghcr.io/myavenceo/aven-platform-provisioner@${{ steps.provisioner.outputs.digest }}
          INTENT_SERVICE_IMAGE: ghcr.io/myavenceo/aven-intent-service@${{ steps.intent.outputs.digest }}
          ACTOR_RUNNER_IMAGE: ghcr.io/myavenceo/aven-actor-runner@${{ steps.actor.outputs.digest }}
          ARTIFACT_STORE_IMAGE: ghcr.io/myavenceo/aven-artifact-store@${{ steps.artifact.outputs.digest }}
          OPERATIONS_IMAGE: ghcr.io/myavenceo/aven-operations@${{ steps.operations.outputs.digest }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{version:1,sha:$sha,runId:($run|tonumber),images:env|with_entries(select(.key|endswith("_IMAGE")))}' > release.json
      - name: Audit the exact published runtime images before releasing their manifest
        run: |
          mapfile -t images < <(jq -r '.images[]' release.json)
          bash scripts/scan-container-os.sh "${images[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: aven-release
          path: release.json
          retention-days: 90
          if-no-files-found: error
